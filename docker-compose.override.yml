# Local-only override: use when running `app` (oms-main) directly from
# IntelliJ instead of as a container, while `gateway` still runs in Docker.
#
# Usage:
#   docker compose up -d redis vault vault-init
#   docker compose up --no-deps -d gateway
#
# Compose picks this file up automatically alongside docker-compose.yml
# (default override filename) — no -f flag needed. Delete or rename it
# when you go back to running `app` in Docker too.

services:
  gateway:
    environment:
      # Overrides the base file's http://app:8080 — there's no `app`
      # container in this scenario, so the gateway needs to reach your
      # IntelliJ-run instance on the host instead. Same trick already used
      # by the `prometheus` service's `oms-host-intellij` scrape target.
      OMS_MONOLITH_URI: http://host.docker.internal:8080
      OMS_JWKS_URI: http://host.docker.internal:8080/.well-known/jwks.json
    extra_hosts:
      # Docker Desktop (Mac/Windows) resolves host.docker.internal for free;
      # this line is what makes it also resolve on Linux.
      - "host.docker.internal:host-gateway"
