# Template only — do NOT apply this file as-is or commit real values into it.
# Copy it, fill in real secrets out of band, and apply the copy (or better,
# manage this Secret through whatever your cluster already uses for secrets
# — Sealed Secrets, External Secrets Operator + a real secret store, Vault,
# etc.). This mirrors exactly the vars env.example marks required/no-default
# for prod: DB_USERNAME/DB_PASSWORD, JWT_PRIVATE_KEY/JWT_PUBLIC_KEY,
# DEFAULT_ADMIN_PASSWORD, REDIS_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: oms-secrets
  labels:
    app.kubernetes.io/name: oms
type: Opaque
stringData:
  DB_USERNAME: "changeme"
  DB_PASSWORD: "changeme"

  # Real RSA key pair required in prod — see application-prod.properties.
  # Never the dev/test throwaway pair from application-{dev,test}.properties.
  JWT_PRIVATE_KEY: "changeme"
  JWT_PUBLIC_KEY: "changeme"

  DEFAULT_ADMIN_PASSWORD: "changeme"
  REDIS_PASSWORD: "changeme"

  # Used by the worker's outbox-depth ScaledObject (07-scaledobject-worker.yaml)
  # via a TriggerAuthentication — same Postgres credentials as above, just in
  # the connection-string shape KEDA's postgresql scaler expects.
  OUTBOX_PG_CONNECTION: "postgresql://changeme:changeme@postgres:5432/oms?sslmode=require"
