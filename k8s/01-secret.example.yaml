# Template only — do NOT apply this file as-is or commit real values into it.
# Copy it, fill in real secrets out of band, and apply the copy.
#
# DB_PASSWORD, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, DEFAULT_ADMIN_PASSWORD and
# REDIS_PASSWORD used to live here but are now resolved from HashiCorp Vault
# instead (Kubernetes auth — see application-{uat,prod}.properties and
# vault/README.md), so the app container never gets them as plain env vars
# in this cluster. What's left here is genuinely not Vault's job:
# DB_USERNAME isn't a secret Vault needs to gate, and OUTBOX_PG_CONNECTION is
# consumed by KEDA's TriggerAuthentication (07-scaledobject-worker.yaml),
# not by the app itself, so it stays as a plain k8s Secret for now.
apiVersion: v1
kind: Secret
metadata:
  name: oms-secrets
  labels:
    app.kubernetes.io/name: oms
type: Opaque
stringData:
  DB_USERNAME: "changeme"

  # Used by the worker's outbox-depth ScaledObject (07-scaledobject-worker.yaml)
  # via a TriggerAuthentication — same Postgres password Vault also holds at
  # secret/oms/<profile>#DB_PASSWORD, just in the connection-string shape
  # KEDA's postgresql scaler expects and duplicated here since KEDA's
  # TriggerAuthentication doesn't itself speak Vault in this setup.
  OUTBOX_PG_CONNECTION: "postgresql://changeme:changeme@postgres:5432/oms?sslmode=require"
