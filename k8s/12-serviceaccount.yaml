# Dedicated ServiceAccount (rather than the namespace's `default`) so Vault's
# Kubernetes auth role can be bound narrowly — bound_service_account_names=oms-app
# in vault/README.md's `vault write auth/kubernetes/role/...` step refers to
# this. Both 02-deployment-web.yaml and 06-deployment-worker.yaml set
# serviceAccountName: oms-app to use it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oms-app
  labels:
    app.kubernetes.io/name: oms
