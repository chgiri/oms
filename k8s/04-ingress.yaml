# Assumes an ingress-nginx controller; swap the class/annotations for
# whatever controller your cluster actually runs. Replace the host and TLS
# secret with real values.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oms-web
  labels:
    app.kubernetes.io/name: oms
    app.kubernetes.io/component: web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - oms.example.com
      secretName: oms-tls
  rules:
    - host: oms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oms-web
                port:
                  name: http
