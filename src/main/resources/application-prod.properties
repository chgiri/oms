# ---------------------------------------------------------------------------
# prod profile. Quiet logs, and ? more importantly ? maximum explicitness
# about which values must be supplied for real. application.properties
# itself already has no fallback for any of jwt.private-key/public-key,
# app.security.default-admin-password, or app.cors.allowed-origins (see the
# comments there) — a missing env var fails startup with a "could not
# resolve placeholder" error regardless of profile, prod included. The
# re-declarations below are redundant with that base-level enforcement, kept
# here anyway so anyone reading prod's config file alone (without also
# having application.properties open) can see at a glance exactly which
# values this profile refuses to run without. Fail fast beats fail insecure.
# ---------------------------------------------------------------------------

logging.level.root=WARN
logging.level.com.giri.oms=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

spring.jpa.show-sql=false

# Real RSA key pair required ? dev and test each have their own throwaway
# pair (application-{dev,test}.properties); neither may ever be reachable here.
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}

# Real admin password required ? no "Admin@123" fallback in prod.
app.security.default-admin-password=${DEFAULT_ADMIN_PASSWORD}

# Real frontend origin(s) required ? no localhost fallback in prod.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Interactive API docs are attack surface with no upside in prod ? off entirely.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# HashiCorp Vault — required (`vault://`, no "optional:" prefix), same
# fail-fast reasoning as everything else in this file: an unreachable Vault
# should stop the deploy, not start the app without real secrets. Kubernetes
# auth against this pod's own ServiceAccount, same mechanism as uat — see the
# comment there and vault/README.md for the Vault-side role/policy setup.
# Deliberately a distinct role name (oms-app-prod) from uat's oms-app-uat so
# a policy scoped to secret/oms/prod can never be reached using a token
# issued for the uat role.
spring.config.import=vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=${VAULT_ADDR}
spring.cloud.vault.authentication=KUBERNETES
spring.cloud.vault.kubernetes.role=${VAULT_KUBERNETES_ROLE:oms-app-prod}
spring.cloud.vault.kubernetes.kubernetes-path=${VAULT_KUBERNETES_AUTH_PATH:kubernetes}
