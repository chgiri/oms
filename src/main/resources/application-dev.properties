# ---------------------------------------------------------------------------
# dev profile ? local development (docker-compose up, or an IDE run config).
# Verbose logging and visible SQL to make local debugging easy; everything
# else falls back to the throwaway defaults already baked into
# application.properties (JWT keys, admin password, CORS origin), which is
# exactly what those defaults are there for.
# ---------------------------------------------------------------------------

logging.level.root=INFO
logging.level.com.giri.oms=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.git-sha=1.0.1
spring.datasource.username=postgres

# Fallback defaults only — used when neither Vault nor a plain env var
# supplies the value (e.g. a bare `./mvnw spring-boot:run` with the local
# Vault container not running). This is the same throwaway dev keypair as
# before, just no longer hardcoded as the only source — see the Vault block
# below and vault/dev/seed.sh, which is what docker-compose's app/app-worker
# actually get their JWT_PRIVATE_KEY/JWT_PUBLIC_KEY from now.
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}

# default is 100 without setting
app.kafka.outbox.batch-size=100

app.security.default-admin-username=admin
# Same fallback pattern as the JWT keys above — Vault (via the dev container)
# or a plain env var overrides this; only used when neither is present.
app.security.default-admin-password=${DEFAULT_ADMIN_PASSWORD:Admin@123}

spring.jpa.show-sql=true

# HashiCorp Vault — local dev parity with uat/prod. docker-compose's `vault`
# service runs in Vault's built-in dev mode (in-memory, auto-unsealed) and
# `vault-init` seeds it from vault/dev/seed.sh; app/app-worker in
# docker-compose.yml set VAULT_ENABLED=true so this actually kicks in there.
# Running from an IDE instead (Vault container not up) just falls through to
# the inline defaults above — VAULT_ENABLED defaults to false in that case.
# Token auth only — this dev server's token is a throwaway checked-in
# default, never used for uat/prod (those use Kubernetes auth instead; see
# application-prod.properties).
#
# The import lives HERE, not in the base application.properties, and
# deliberately in the same file as the authentication/token lines below —
# see the long comment on spring.cloud.vault.enabled in application.properties
# for why: an import declared in a profile-independent file resolves before
# profile-specific files like this one are even read, so co-locating them
# here is what makes TOKEN auth actually be configured by the time this
# import fires.
spring.config.import=optional:vault://
spring.cloud.vault.uri=${VAULT_ADDR:http://localhost:8200}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN:oms-dev-root-token}

spring.cloud.vault.enabled=true