# ---------------------------------------------------------------------------
# test profile ? shared QA/test environment (not to be confused with the
# JUnit test run, which uses Testcontainers + @DynamicPropertySource and
# never activates a Spring profile at all ? see AbstractIntegrationTest).
# Behaves like prod-lite: quieter logs, no SQL dump, but still permissive
# enough (Swagger on, throwaway JWT/admin defaults allowed) for testers and
# automated test suites to exercise the API easily.
# ---------------------------------------------------------------------------

logging.level.root=INFO
logging.level.com.giri.oms=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

spring.jpa.show-sql=false

# Throwaway values this profile's own comment promises ("throwaway JWT/admin
# defaults allowed") — these used to come from application.properties'
# base-level fallback, which was removed so dev's convenience defaults can't
# leak into uat/prod by accident. That means every profile that still wants
# a throwaway value now has to say so itself; this is test's copy of the
# same ones application-dev.properties sets. Override with real
# DEFAULT_ADMIN_USERNAME/DEFAULT_ADMIN_PASSWORD/CORS_ALLOWED_ORIGINS env vars
# if this environment ever needs to stop being throwaway.
app.cors.allowed-origins=http://localhost:4200
app.security.default-admin-username=admin
app.security.default-admin-password=Admin@123

# Test's own throwaway RSA keypair — deliberately NOT the same pair as
# application-dev.properties. Sharing one throwaway pair across dev and test
# would mean a token minted by a developer's local instance is also a valid
# token against the shared test environment (and vice versa), which defeats
# the point of these being separate environments even though neither key is
# a real secret. Generated the same way as the base file's comment describes
# (openssl genpkey/rsa, base64 -w0 onto one line). Not given a distinct
# key-id here — application.properties' jwt.key-id default is generic enough
# to reuse; override with JWT_KEY_ID if you ever need this environment's
# tokens to carry a distinguishable "kid".
jwt.private-
jwt.public-
