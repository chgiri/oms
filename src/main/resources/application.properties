spring.application.name=oms

# Process role — lets "scale the app" mean "scale web and worker
# independently" instead of "scale everything". Guards the 3 @KafkaListener
# consumers (OrderCreatedInventoryConsumer, OrderSagaEventConsumer,
# OrderConfirmedShipmentConsumer) and OutboxPublisher's @Scheduled poller via
# @ConditionalOnProperty(name = "app.process.role", havingValue = "worker",
# matchIfMissing = true) on each of those classes.
#
# One of: web (API only, no consumers/outbox poller), worker (consumers +
# outbox poller; Tomcat still starts unless you also set
# spring.main.web-application-type=none — see docker-compose.yml's
# app-worker service), or unset (both, today's behavior — an instance with
# no APP_PROCESS_ROLE set runs everything, exactly as before this property
# existed).
#
# Deliberately NOT given a `=${APP_PROCESS_ROLE:}` default value here: Spring
# would then treat the property as present-but-empty even when the env var
# is unset, which fails the havingValue="worker" match and defeats
# matchIfMissing — the "unset = both" default depends on the property
# genuinely being absent. Spring's relaxed env-var binding still picks up
# APP_PROCESS_ROLE as app.process.role without a line here.

# Which environment profile to load (dev/test/uat/prod ? see application-{profile}.properties).
# Defaults to dev so a bare `./mvnw spring-boot:run` / IDE run config works out of the box;
# every real deployment should set SPRING_PROFILES_ACTIVE explicitly rather than rely on this.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Graceful shutdown — without this, SIGTERM (a rolling deploy, a Docker/k8s
# stop, `docker compose down`) tears things down immediately: an in-flight
# HTTP request gets cut off mid-response, a Kafka listener can be killed
# mid-record (before its offset commits, so it's redelivered — not data loss,
# but still avoidable churn), and the outbox poller's scheduled task
# (OutboxPublisher.publishPendingEvents, which holds a DB transaction across
# several Kafka sends — see its own Javadoc) can be interrupted mid-batch.
#
# server.shutdown=graceful switches Tomcat to refuse new requests but let
# in-flight ones finish. spring.lifecycle.timeout-per-shutdown-phase is the
# umbrella timeout Spring applies to every SmartLifecycle bean's shutdown —
# that includes Tomcat's graceful drain above AND every @KafkaListener's
# container (Spring lets a container finish the record/batch it's currently
# processing before stopping, rather than aborting it — see
# spring.kafka.listener.immediate-stop, which defaults to false, i.e. exactly
# the behavior we want, so it's intentionally left unset here).
#
# The @Scheduled outbox poller isn't a SmartLifecycle bean, so it needs its
# own pair of properties instead: task.scheduling.shutdown.await-termination
# tells Spring Boot's auto-configured scheduler to wait for a currently-running
# @Scheduled method to finish (rather than interrupting its thread) before the
# context finishes closing, and the -period below caps how long it'll wait.
#
# Both timeouts are 30s here — comfortably more than a single outbox batch or
# HTTP request should ever take, but short enough that a genuinely stuck task
# doesn't hang a deploy forever. If you tune app.kafka.outbox.batch-size up,
# revisit this alongside it (see OutboxPublisher's Javadoc on that trade-off).
# Whatever this is set to, the container orchestrator's own kill timeout
# (docker-compose's stop_grace_period, Kubernetes' terminationGracePeriodSeconds)
# must be set comfortably longer than it — otherwise the orchestrator SIGKILLs
# the process before Spring's own graceful shutdown ever gets to finish, which
# defeats the entire point of configuring it here.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s
# Overridable so the app can reach Postgres by container/service name (e.g. "postgres")
# when running under Docker, instead of always assuming localhost.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oms}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DB related
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Kafka ? domain events via transactional outbox (Phase 1: OrderCreated only).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


app.kafka.topics.order-events=oms.order.events
app.kafka.outbox.poll-interval-ms=5000
app.kafka.outbox.batch-size=100

# Kafka consumer (Phase 2 ? OrderCreatedInventoryConsumer reserves stock).
# auto-offset-reset=earliest: on a brand-new consumer group (first deploy, or a
# renamed group), read from the start of the topic rather than only new messages
# from now on ? correctness (not missing anyone's order) matters more here than
# avoiding a catch-up backlog on first run.
# enable-auto-commit=false: Spring Kafka commits the offset itself after the
# listener method returns successfully, not on a timer ? so a crash mid-processing
# redelivers the message instead of silently losing it.
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:oms-inventory-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Second consumer group on the same oms.order.events topic ? OrderSagaEventConsumer
# reacts to Phase 2 outcomes (InventoryReserved/InventoryReservationFailed) to move
# orders to AWAITING_PAYMENT/CANCELLED, independently of the inventory group above.
# A distinct group-id is what makes this an independent broadcast subscriber rather
# than competing with oms-inventory-service for the same partitions.
app.kafka.consumer.order-service-group-id=${KAFKA_ORDER_SERVICE_CONSUMER_GROUP:oms-order-service}

# Third consumer group on the same topic ? OrderConfirmedShipmentConsumer
# auto-creates a shipment once Phase 3 confirms an order.
app.kafka.consumer.shipment-service-group-id=${KAFKA_SHIPMENT_SERVICE_CONSUMER_GROUP:oms-shipment-service}

# Default carrier for shipments auto-created off OrderConfirmed (see
# ShipmentAutoCreationServiceImpl) ? the saga has no notion yet of a
# customer-chosen carrier, so every auto-created shipment gets this one until
# that's modeled. Note there's currently no endpoint to change a shipment's
# carrier after creation ? only status/tracking (PATCH .../status) ? so this
# default is effectively permanent per shipment until that's added too.
app.shipment.default-carrier=${SHIPMENT_DEFAULT_CARRIER:OTHER}

# Redis ? shared by: Spring Cache (product/inventory reads), Redisson (distributed
# locks + rate limiter backend) and the JWT logout blacklist. All three reuse this
# single connection, so in production point it at a real Redis/Valkey instance.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Spring Cache ? backing store + default TTL; per-cache TTLs are set in CacheConfig.
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# Login rate limiting (Bucket4j + Redis) ? brute-force protection, keyed per client IP.
app.ratelimit.login.capacity=5
app.ratelimit.login.refill-tokens=5
app.ratelimit.login.refill-duration-seconds=60

# Distributed lock (Redisson) around inventory read-modify-write updates, so two app
# instances updating the same inventory row concurrently can't silently drop a change.
app.lock.inventory.wait-seconds=3
app.lock.inventory.lease-seconds=5

# JWT ? RS256 (asymmetric signing): jwt.private-key signs tokens, jwt.public-key
# verifies them, and only the public key is ever handed to anyone else — it's also
# published live at /.well-known/jwks.json (see security.JwksController) so a future
# independent service can fetch and cache it to validate tokens without ever holding
# the private key, i.e. without gaining the ability to mint tokens itself. Both
# values are the full PEM text (PKCS8 private / X.509 public), Base64-encoded onto
# one line so they fit as a single property/env value; JwtService decodes and
# reparses the PEM at startup.
#
# The pair below is a THROWAWAY key generated for this repo, checked in only so a
# fresh checkout runs immediately, exactly like the old jwt.secret default it
# replaces. There's no default value at this base level on purpose — matching
# app.security.default-admin-password/app.cors.allowed-origins above, a
# missing JWT_PRIVATE_KEY/JWT_PUBLIC_KEY should fail startup here rather than
# silently signing tokens with a key baked into every checkout of this repo.
# dev and test each set their own throwaway keypair directly in
# application-{dev,test}.properties (two different pairs, not one shared
# between them, so a token signed by one environment is never accidentally
# valid in the other); uat and prod both require the real env vars — see
# application-prod.properties, and the equivalent note in
# application-uat.properties. Generate a fresh pair with:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private_key.pem
#   openssl rsa -pubout -in private_key.pem -out public_key.pem
#   base64 -w0 private_key.pem   # -> JWT_PRIVATE_KEY
#   base64 -w0 public_key.pem    # -> JWT_PUBLIC_KEY
# jwt.key-id is stamped on every token's "kid" header and mirrored in the JWKS
# document; give it a new value whenever you rotate to a new key pair so a verifier
# can tell which public key a given token was signed with.
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.key-id=${JWT_KEY_ID:oms-dev-key-1}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default admin account bootstrapped on first startup if no users exist yet ?
# see com.giri.oms.auth.config.AdminUserSeeder. Change the password after first login.
# No fallback here on purpose ? a missing DEFAULT_ADMIN_USERNAME/PASSWORD fails
# startup instead of silently seeding a guessable admin account anywhere,
# including uat/prod. dev and test each set their own throwaway values
# directly in application-{dev,test}.properties; uat and prod both require
# the real env vars to be supplied.
app.security.default-admin-username=${DEFAULT_ADMIN_USERNAME}
app.security.default-admin-password=${DEFAULT_ADMIN_PASSWORD}


# CORS ? origins allowed to call this API from a browser (see common.config.CorsConfig).
# Comma-separated list. No fallback here on purpose ? a missing CORS_ALLOWED_ORIGINS
# fails startup instead of silently defaulting to a localhost origin anywhere,
# including uat/prod. dev and test each set their own localhost value directly
# in application-{dev,test}.properties; uat and prod both require the real
# origin(s) to be supplied via env var.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Pagination ? caps client-requested page size; requests above this are
# silently clamped to max-page-size (not rejected with an error).
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false

# Logging ? pattern is shared across all environments; the actual levels (root,
# com.giri.oms, SQL) are environment-specific and set per profile (see
# application-{dev,test,uat,prod}.properties) since dev wants verbose/DEBUG output
# and prod wants quieter logs.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n

logging.level.org.apache.kafka.clients=WARN
logging.level.org.apache.kafka.clients.consumer.internals.AbstractCoordinator=INFO

# Sort endpoints/tags alphabetically in the UI
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Optional: move the UI to a custom path
springdoc.swagger-ui.path=/docs

# Swagger UI / raw API docs are disabled outright in the prod profile
# (see application-prod.properties) rather than here, so they stay on by
# default everywhere else (dev/test/uat).

# Actuator ? only /actuator/health and /actuator/info are exposed (see
# SecurityConfig), used by the Docker/Compose healthcheck below and by
# deploy tooling asking "what's actually running?". show-details stays
# "never" publicly; a real ops setup would put the full actuator surface
# behind an internal-only port instead.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true

# Surfaced at /actuator/info — set by the Dockerfile's APP_VERSION/APP_GIT_SHA
# ARGs at build time (see Dockerfile). Answers "which commit/version is this
# container actually running?" without guessing from deploy timestamps.
# Defaults to "unknown" so a plain local `./mvnw spring-boot:run` (no Docker,
# no env vars) still starts fine.
info.app.version=${APP_VERSION:unknown}
info.app.git-sha=${APP_GIT_SHA:unknown}
