spring.application.name=oms

# Process role ? lets "scale the app" mean "scale web and worker
# independently" instead of "scale everything". Guards the 3 @KafkaListener
# consumers (OrderCreatedInventoryConsumer, OrderSagaEventConsumer,
# OrderConfirmedShipmentConsumer) and OutboxPublisher's @Scheduled poller via
# @ConditionalOnProperty(name = "app.process.role", havingValue = "worker",
# matchIfMissing = true) on each of those classes.
#
# One of: web (API only, no consumers/outbox poller), worker (consumers +
# outbox poller; Tomcat still starts unless you also set
# spring.main.web-application-type=none ? see docker-compose.yml's
# app-worker service), or unset (both, today's behavior ? an instance with
# no APP_PROCESS_ROLE set runs everything, exactly as before this property
# existed).
#
# Deliberately NOT given a `=${APP_PROCESS_ROLE:}` default value here: Spring
# would then treat the property as present-but-empty even when the env var
# is unset, which fails the havingValue="worker" match and defeats
# matchIfMissing ? the "unset = both" default depends on the property
# genuinely being absent. Spring's relaxed env-var binding still picks up
# APP_PROCESS_ROLE as app.process.role without a line here.

# Which environment profile to load (dev/test/uat/prod ? see application-{profile}.properties).
# Defaults to dev so a bare `./mvnw spring-boot:run` / IDE run config works out of the box;
# every real deployment should set SPRING_PROFILES_ACTIVE explicitly rather than rely on this.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Graceful shutdown ? without this, SIGTERM (a rolling deploy, a Docker/k8s
# stop, `docker compose down`) tears things down immediately: an in-flight
# HTTP request gets cut off mid-response, a Kafka listener can be killed
# mid-record (before its offset commits, so it's redelivered ? not data loss,
# but still avoidable churn), and the outbox poller's scheduled task
# (OutboxPublisher.publishPendingEvents, which holds a DB transaction across
# several Kafka sends ? see its own Javadoc) can be interrupted mid-batch.
#
# server.shutdown=graceful switches Tomcat to refuse new requests but let
# in-flight ones finish. spring.lifecycle.timeout-per-shutdown-phase is the
# umbrella timeout Spring applies to every SmartLifecycle bean's shutdown ?
# that includes Tomcat's graceful drain above AND every @KafkaListener's
# container (Spring lets a container finish the record/batch it's currently
# processing before stopping, rather than aborting it ? see
# spring.kafka.listener.immediate-stop, which defaults to false, i.e. exactly
# the behavior we want, so it's intentionally left unset here).
#
# The @Scheduled outbox poller isn't a SmartLifecycle bean, so it needs its
# own pair of properties instead: task.scheduling.shutdown.await-termination
# tells Spring Boot's auto-configured scheduler to wait for a currently-running
# @Scheduled method to finish (rather than interrupting its thread) before the
# context finishes closing, and the -period below caps how long it'll wait.
#
# Both timeouts are 30s here ? comfortably more than a single outbox batch or
# HTTP request should ever take, but short enough that a genuinely stuck task
# doesn't hang a deploy forever. If you tune app.kafka.outbox.batch-size up,
# revisit this alongside it (see OutboxPublisher's Javadoc on that trade-off).
# Whatever this is set to, the container orchestrator's own kill timeout
# (docker-compose's stop_grace_period, Kubernetes' terminationGracePeriodSeconds)
# must be set comfortably longer than it ? otherwise the orchestrator SIGKILLs
# the process before Spring's own graceful shutdown ever gets to finish, which
# defeats the entire point of configuring it here.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s
# Overridable so the app can reach Postgres by container/service name (e.g. "postgres")
# when running under Docker, instead of always assuming localhost.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oms}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DB related
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Kafka ? domain events via transactional outbox (Phase 1: OrderCreated only).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Distributed tracing for Kafka ? mirrors what HTTP gets automatically just by
# having the tracing bridge on the classpath (see pom.xml). With this on,
# KafkaTemplate.send() creates a producer span and propagates it as a
# traceparent record header, and every @KafkaListener creates a consumer span
# linked to it ? the same propagation mechanism this project already uses for
# correlationId (see MdcCorrelation's Javadoc), just for trace context instead.
# Applies to direct sends/listeners only: OutboxPublisher's send happens well
# after the original HTTP span has ended (see OutboxPublisher's Javadoc), so
# that hop still starts a new, disconnected trace today ? bridging it with
# span links persisted on OutboxEvent is a follow-up, not covered by this flag.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true


app.kafka.topics.order-events=oms.order.events
# Phase 1 of the microservices-prep plan ? see EventType's Product* constants
# and messaging/event/ProductEventFactory. Consumed by inventory's
# ProductEventInventoryConsumer to keep the product_ref replica in sync.
app.kafka.topics.product-events=oms.product.events
app.kafka.outbox.poll-interval-ms=5000
app.kafka.outbox.batch-size=100

# Kafka consumer (Phase 2 ? OrderCreatedInventoryConsumer reserves stock).
# auto-offset-reset=earliest: on a brand-new consumer group (first deploy, or a
# renamed group), read from the start of the topic rather than only new messages
# from now on ? correctness (not missing anyone's order) matters more here than
# avoiding a catch-up backlog on first run.
# enable-auto-commit=false: Spring Kafka commits the offset itself after the
# listener method returns successfully, not on a timer ? so a crash mid-processing
# redelivers the message instead of silently losing it.
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:oms-inventory-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Second consumer group on the same oms.order.events topic ? OrderSagaEventConsumer
# reacts to Phase 2 outcomes (InventoryReserved/InventoryReservationFailed) to move
# orders to AWAITING_PAYMENT/CANCELLED, independently of the inventory group above.
# A distinct group-id is what makes this an independent broadcast subscriber rather
# than competing with oms-inventory-service for the same partitions.
app.kafka.consumer.order-service-group-id=${KAFKA_ORDER_SERVICE_CONSUMER_GROUP:oms-order-service}

# Third consumer group on the same topic ? OrderConfirmedShipmentConsumer
# auto-creates a shipment once Phase 3 confirms an order.
app.kafka.consumer.shipment-service-group-id=${KAFKA_SHIPMENT_SERVICE_CONSUMER_GROUP:oms-shipment-service}

# Default carrier for shipments auto-created off OrderConfirmed (see
# ShipmentAutoCreationServiceImpl) ? the saga has no notion yet of a
# customer-chosen carrier, so every auto-created shipment gets this one until
# that's modeled. Note there's currently no endpoint to change a shipment's
# carrier after creation ? only status/tracking (PATCH .../status) ? so this
# default is effectively permanent per shipment until that's added too.
app.shipment.default-carrier=${SHIPMENT_DEFAULT_CARRIER:OTHER}

# Redis ? shared by: Spring Cache (product/inventory reads), Redisson (distributed
# locks + rate limiter backend) and the JWT logout blacklist. All three reuse this
# single connection, so in production point it at a real Redis/Valkey instance.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Spring Cache ? backing store + default TTL; per-cache TTLs are set in CacheConfig.
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# Login rate limiting (Bucket4j + Redis) ? brute-force protection, keyed per client IP.
app.ratelimit.login.capacity=5
app.ratelimit.login.refill-tokens=5
app.ratelimit.login.refill-duration-seconds=60

# Distributed lock (Redisson) around inventory read-modify-write updates, so two app
# instances updating the same inventory row concurrently can't silently drop a change.
app.lock.inventory.wait-seconds=3
app.lock.inventory.lease-seconds=5

# JWT ? RS256 (asymmetric signing): jwt.private-key signs tokens, jwt.public-key
# verifies them, and only the public key is ever handed to anyone else ? it's also
# published live at /.well-known/jwks.json (see security.JwksController) so a future
# independent service can fetch and cache it to validate tokens without ever holding
# the private key, i.e. without gaining the ability to mint tokens itself. Both
# values are the full PEM text (PKCS8 private / X.509 public), Base64-encoded onto
# one line so they fit as a single property/env value; JwtService decodes and
# reparses the PEM at startup.
#
# The pair below is a THROWAWAY key generated for this repo, checked in only so a
# fresh checkout runs immediately, exactly like the old jwt.secret default it
# replaces. There's no default value at this base level on purpose ? matching
# app.security.default-admin-password above, a
# missing JWT_PRIVATE_KEY/JWT_PUBLIC_KEY should fail startup here rather than
# silently signing tokens with a key baked into every checkout of this repo.
# dev and test each set their own throwaway keypair directly in
# application-{dev,test}.properties (two different pairs, not one shared
# between them, so a token signed by one environment is never accidentally
# valid in the other); uat and prod both require the real env vars ? see
# application-prod.properties, and the equivalent note in
# application-uat.properties. Generate a fresh pair with:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private_key.pem
#   openssl rsa -pubout -in private_key.pem -out public_key.pem
#   base64 -w0 private_key.pem   # -> JWT_PRIVATE_KEY
#   base64 -w0 public_key.pem    # -> JWT_PUBLIC_KEY
# jwt.key-id is stamped on every token's "kid" header and mirrored in the JWKS
# document; give it a new value whenever you rotate to a new key pair so a verifier
# can tell which public key a given token was signed with.
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.key-id=${JWT_KEY_ID:oms-dev-key-1}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# HashiCorp Vault ? off by default here; each profile turns it on, sets its
# own spring.config.import=vault:// (or optional:vault://), AND its own auth
# method (spring.cloud.vault.authentication + credentials) together in that
# SAME profile file ? see application-{dev,uat,prod}.properties and
# vault/README.md for the Vault-side policy/role setup.
#
# The import is deliberately NOT declared here in the base file, even though
# that'd read as more "shared". Spring Boot resolves spring.config.import in
# profile-independent documents (this file) before it even loads
# profile-specific ones (application-{profile}.properties) ? so an import
# declared here would try to authenticate to Vault using whatever auth
# method/credentials happen to already be visible at that early point
# (defaulting to TOKEN with no token configured), before the profile file
# that actually sets spring.cloud.vault.authentication ever gets read. Kept
# here as a base-level property (not an import), spring.cloud.vault.enabled
# is safe either way since VAULT_ENABLED is a real env var resolved
# immediately ? it's specifically the *import* that needs to stay
# co-located with its profile's auth config, not this flag.
spring.cloud.vault.enabled=${VAULT_ENABLED:false}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.backend-version=2
# Looks up secret/oms (spring.application.name) and, when a profile is
# active, also secret/oms/<profile> ? the latter overriding the former.
# That's Spring Cloud Vault's built-in default context resolution, so no
# spring.cloud.vault.kv.default-context override is needed here.

# Stage 2 of the microservices-prep plan (Phase 4, Product extraction) - see
# productclient.config.ProductClientConfig. Points at product-service's own
# base URL (see that repo's docker-compose.snippet.yml - 8082 on the host,
# 8080 inside the compose network); override for any real deployment.
# Connect/read timeouts are what actually bounds a single call's duration -
# see ProductClientConfig's Javadoc for why that's on the RestClient's
# request factory rather than resilience4j's TimeLimiter. Tracing for this
# outbound call is NOT configured here - it comes for free from the
# micrometer-tracing-bridge-otel dependency in pom.xml, as long as
# ProductClientConfig builds its RestClient from the injected RestClient.Builder
# bean rather than the static RestClient.builder() factory (see that class's
# Javadoc for why that distinction actually matters).
app.productclient.base-url=${PRODUCT_SERVICE_URL:http://localhost:8082/api/v1}

# Stage 3 of the microservices-prep plan (data cutover) — see
# ProductWritesFrozenException and docs/stage3-data-cutover-runbook.md.
# MUST default to false. Only ever set true for the duration of an active
# cutover window (the runbook sets/unsets it), never left on.
app.product.writes-frozen=${PRODUCT_WRITES_FROZEN:false}
app.productclient.connect-timeout-ms=${PRODUCT_CLIENT_CONNECT_TIMEOUT_MS:300}
app.productclient.read-timeout-ms=${PRODUCT_CLIENT_READ_TIMEOUT_MS:800}

# Retry: per Stage 0's resilience decision, only a timeout/connection failure
# or a 5xx is worth retrying - a 404 (ProductNotFoundException) is a
# legitimate business rejection, never retried. max-attempts=2 means the
# original call plus 1 retry, per Stage 0's "1-2 retries with backoff".
resilience4j.retry.instances.productClient.max-attempts=2
resilience4j.retry.instances.productClient.wait-duration=200ms
resilience4j.retry.instances.productClient.retry-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.productClient.ignore-exceptions=com.giri.oms.product.exception.ProductNotFoundException

# Circuit breaker: opens once 50% of the last 10 calls failed, stays open
# 10s (fails fast for every call in that window instead of each one paying
# the full timeout+retry cost - see ProductClientImpl), then allows 3 trial
# calls through in half-open state before deciding to close or re-open.
# Same record/ignore split as the retry config above, and for the same
# reason - a 404 must never count toward opening the circuit.
resilience4j.circuitbreaker.instances.productClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.productClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productClient.record-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.productClient.ignore-exceptions=com.giri.oms.product.exception.ProductNotFoundException

# Stage 2 of the microservices-prep plan (Phase 4, Customer extraction) — see
# customerclient.config.CustomerClientConfig. Identical shape to the
# productclient.* block above — see there for the full reasoning on
# timeouts/tracing; not repeated here. Points at customer-service's own base
# URL (see that repo's docker-compose.snippet.yml — 8083 on the host, 8080
# inside the compose network); override for any real deployment.
app.customerclient.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8083/api/v1}
app.customerclient.connect-timeout-ms=${CUSTOMER_CLIENT_CONNECT_TIMEOUT_MS:300}
app.customerclient.read-timeout-ms=${CUSTOMER_CLIENT_READ_TIMEOUT_MS:800}

# Same Stage 0 resilience decision, same values, as productClient above.
resilience4j.retry.instances.customerClient.max-attempts=2
resilience4j.retry.instances.customerClient.wait-duration=200ms
resilience4j.retry.instances.customerClient.retry-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.customerClient.ignore-exceptions=com.giri.oms.customer.exception.CustomerNotFoundException

resilience4j.circuitbreaker.instances.customerClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.customerClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.customerClient.record-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.customerClient.ignore-exceptions=com.giri.oms.customer.exception.CustomerNotFoundException

# Default admin account bootstrapped on first startup if no users exist yet ?
# see com.giri.oms.auth.config.AdminUserSeeder. Change the password after first login.
# No fallback here on purpose ? a missing DEFAULT_ADMIN_USERNAME/PASSWORD fails
# startup instead of silently seeding a guessable admin account anywhere,
# including uat/prod. dev and test each set their own throwaway values
# directly in application-{dev,test}.properties; uat and prod both require
# the real env vars to be supplied.
app.security.default-admin-username=${DEFAULT_ADMIN_USERNAME}
app.security.default-admin-password=${DEFAULT_ADMIN_PASSWORD}

# Pagination ? caps client-requested page size; requests above this are
# silently clamped to max-page-size (not rejected with an error).
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false

# Logging ? pattern is shared across all environments; the actual levels (root,
# com.giri.oms, SQL) are environment-specific and set per profile (see
# application-{dev,test,uat,prod}.properties) since dev wants verbose/DEBUG output
# and prod wants quieter logs.
#
# traceId/spanId are populated by Micrometer Tracing (see the tracing bridge
# dependency in pom.xml) for anything with a live span ? an HTTP request, or a
# Kafka send/listener once spring.kafka.template/listener.observation-enabled
# below take effect. They print as "-" for now on the outbox poller thread
# (OutboxPublisher), since that scheduler thread has no active span until the
# outbox/span-link follow-up lands. Kept in the log line (not just as MDC-only
# fields) specifically so Promtail ships them to Loki as searchable text and
# Grafana's Loki datasource can derive a "view trace" link straight from a log
# line to Tempo (see monitoring/grafana/provisioning/datasources/datasource.yml)
# ? same reasoning as correlationId already being in this pattern.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %-5level %logger{36} - %msg%n

logging.level.org.apache.kafka.clients=WARN
logging.level.org.apache.kafka.clients.consumer.internals.AbstractCoordinator=INFO

# Sort endpoints/tags alphabetically in the UI
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Optional: move the UI to a custom path
springdoc.swagger-ui.path=/docs

# Swagger UI / raw API docs are disabled outright in the prod profile
# (see application-prod.properties) rather than here, so they stay on by
# default everywhere else (dev/test/uat).

# Actuator ? health/info/prometheus exposed (see SecurityConfig for which
# paths are permitAll). health is used by the Docker/Compose healthcheck and
# k8s probes; info answers "what's actually running?"; prometheus is scraped
# by Prometheus/KEDA-adjacent tooling. show-details stays "never" publicly.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true

# The internal-only port the comment above used to just gesture at ? actuator
# (including /actuator/prometheus) now lives here, not on server.port. Nothing
# in k8s/ forwards this port through the web Service/Ingress, so it's only
# reachable from inside the cluster network (e.g. Prometheus scraping the pod
# IP directly), regardless of the permitAll rule SecurityConfig adds for it.
management.server.port=${MANAGEMENT_SERVER_PORT:8081}

# Every metric gets an "application" tag and a "role" tag (web/worker/unset ?
# mirrors APP_PROCESS_ROLE, see docs/process-roles.md). Without the role tag,
# web and worker metrics for the same app/jar would land in the same series
# once both scrape targets are in Prometheus ? this is what lets a dashboard
# or alert split, say, HTTP latency (web) from outbox publish latency
# (worker) even though both come from the same image.
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.role=${APP_PROCESS_ROLE:unset}

# Histogram buckets (not just min/max/avg/count) for HTTP request latency, so
# Prometheus can compute real percentiles via histogram_quantile() instead of
# only an average ? this is also what a request-rate-based HPA (see the note
# in k8s/05-hpa-web.yaml) would query against, if that's ever wired up.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Distributed tracing export ? see monitoring/tempo/ and the tempo service in
# docker-compose.yml. Points at Tempo's OTLP/HTTP receiver; overridden to
# tempo:4318 (the in-network service name) via OTLP_TRACING_ENDPOINT in
# docker-compose.yml's app/app-worker environment blocks, same pattern as
# KAFKA_BOOTSTRAP_SERVERS. The localhost default here is only so a bare
# `./mvnw spring-boot:run` (Tempo running via
# `docker compose up -d tempo`) still exports somewhere sensible.
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# Fraction of requests actually traced and exported, independent of whether a
# trace is created (creation itself is effectively free; export is the
# expensive part at volume). 1.0 = every request, fine for local dev traffic
# levels ? overridden lower for prod-scale traffic in each profile that needs
# it (see application-dev.properties for the local-dev override; no profile
# currently runs at a volume where this default needs lowering, but
# TRACING_SAMPLING_PROBABILITY is the knob to reach for if/when one does).
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

# Surfaced at /actuator/info ? set by the Dockerfile's APP_VERSION/APP_GIT_SHA
# ARGs at build time (see Dockerfile). Answers "which commit/version is this
# container actually running?" without guessing from deploy timestamps.
# Defaults to "unknown" so a plain local `./mvnw spring-boot:run` (no Docker,
# no env vars) still starts fine.
info.app.version=${APP_VERSION:unknown}
info.app.git-sha=${APP_GIT_SHA:unknown}