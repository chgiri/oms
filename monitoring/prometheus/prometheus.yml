# Local-dev Prometheus config for the docker-compose stack. This is the
# plain-Prometheus analog of k8s/09-podmonitor.yaml — same target (each
# instance's /actuator/prometheus on the metrics port), different discovery
# mechanism because there's no Prometheus Operator here.
#
# `app` uses a static target: it has a fixed container_name and a single
# instance in compose. `app-worker` deliberately does NOT have a
# container_name (see docker-compose.yml) specifically so it can be scaled
# with `docker compose up -d --scale app-worker=3` — a static target would
# only ever see one of those replicas. dns_sd_configs re-resolves the
# service name on every refresh_interval and expands it to one target per
# container Docker's embedded DNS returns, so scaling the worker is picked
# up automatically without touching this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: oms-web
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]
        labels:
          compose_service: app

  - job_name: oms-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["app-worker"]
        type: A
        port: 8081
        refresh_interval: 15s

  # Stage 7 of the microservices-prep plan (Phase 4, Product extraction).
  # Static target, same reasoning as oms-web above — product-service has a
  # fixed container_name and a single instance in compose (no --scale usage
  # for it yet). Note the port: 8081 here is the CONTAINER's own metrics
  # port (product-service's management.server.port), not the host-mapped
  # 8093 from docker-compose.yml's product-service service — Prometheus
  # itself runs inside the compose network, so it reaches product-service
  # the same way app/app-worker reach each other, not via a host port.
  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product-service:8081"]
        labels:
          compose_service: product-service

  # Stage 7 of the microservices-prep plan (Phase 4, Shipment extraction).
  # Single container in docker-compose.yml, no web/worker split there (see
  # that file's shipment-service block), so a static target is correct here
  # the same way oms-web's/product-service's are, and for the same reason
  # (fixed container_name, single instance).
  - job_name: shipment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shipment-service:8081"]
        labels:
          compose_service: shipment-service

  # For running the app straight from IntelliJ instead of the `app`/
  # `app-worker` containers — point your run config at postgres/kafka/redis
  # via their published host ports (localhost:5432, localhost:29092,
  # localhost:6379; see .env), and this job picks it up on 8081 the same
  # way oms-web does for the containerized version. Harmless to leave
  # enabled even when you're not using it: if nothing's listening on
  # host.docker.internal:8081, this target just shows as "down" in
  # Prometheus (Status → Targets) instead of erroring.
  - job_name: oms-host-intellij
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          compose_service: host-intellij

  # Stage 7 of the microservices-prep plan (Phase 4, Customer extraction).
  # Same reasoning as product-service's target above — 8081 is
  # customer-service's own container metrics port, not the host-mapped
  # 8092 from docker-compose.yml.
  - job_name: customer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["customer-service:8081"]
        labels:
          compose_service: customer-service

  # For running the app straight from IntelliJ instead of the `app`/
  # `app-worker` containers — point your run config at postgres/kafka/redis
  # via their published host ports (localhost:5432, localhost:29092,
  # localhost:6379; see .env), and this job picks it up on 8081 the same
  # way oms-web does for the containerized version. Harmless to leave
  # enabled even when you're not using it: if nothing's listening on
  # host.docker.internal:8081, this target just shows as "down" in
  # Prometheus (Status → Targets) instead of erroring.
  - job_name: oms-host-intellij
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          compose_service: host-intellij
