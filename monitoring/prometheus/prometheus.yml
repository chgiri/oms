# Local-dev Prometheus config for the docker-compose stack. This is the
# plain-Prometheus analog of k8s/09-podmonitor.yaml — same target (each
# instance's /actuator/prometheus on the metrics port), different discovery
# mechanism because there's no Prometheus Operator here.
#
# `app` uses a static target: it has a fixed container_name and a single
# instance in compose. `app-worker` deliberately does NOT have a
# container_name (see docker-compose.yml) specifically so it can be scaled
# with `docker compose up -d --scale app-worker=3` — a static target would
# only ever see one of those replicas. dns_sd_configs re-resolves the
# service name on every refresh_interval and expands it to one target per
# container Docker's embedded DNS returns, so scaling the worker is picked
# up automatically without touching this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: oms-web
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]
        labels:
          compose_service: app

  - job_name: oms-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["app-worker"]
        type: A
        port: 8081
        refresh_interval: 15s

  # For running the app straight from IntelliJ instead of the `app`/
  # `app-worker` containers — point your run config at postgres/kafka/redis
  # via their published host ports (localhost:5432, localhost:29092,
  # localhost:6379; see .env), and this job picks it up on 8081 the same
  # way oms-web does for the containerized version. Harmless to leave
  # enabled even when you're not using it: if nothing's listening on
  # host.docker.internal:8081, this target just shows as "down" in
  # Prometheus (Status → Targets) instead of erroring.
  - job_name: oms-host-intellij
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          compose_service: host-intellij
