# Tells Grafana to load every .json dashboard in ../dashboards (mounted at
# /var/lib/grafana/dashboards in the container — see docker-compose.yml) on
# startup, and to keep polling for changes so editing the JSON on disk and
# restarting (or waiting `updateIntervalSeconds`) picks it up without
# clicking through Import in the UI.
apiVersion: 1

providers:
  - name: oms
    orgId: 1
    folder: OMS
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
