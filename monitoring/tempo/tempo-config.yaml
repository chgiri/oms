# Single-binary, filesystem-backed Tempo — same local-dev scope as
# loki-config.yaml (see its comment for the same reasoning): no object
# storage, no replication, no multi-tenant auth. Receives spans over
# OTLP from app/app-worker (management.otlp.tracing.endpoint in
# application.properties, pointed at tempo:4318 via OTLP_TRACING_ENDPOINT
# in docker-compose.yml) and is queried by Grafana (see the Tempo
# datasource in monitoring/grafana/provisioning/datasources/datasource.yml).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# 7 days, matching loki-config.yaml's limits_config.retention_period —
# keeps oms-tempo-data from growing unbounded on local dev.
compactor:
  compaction:
    block_retention: 168h
