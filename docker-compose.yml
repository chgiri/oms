services:
  postgres:
    image: postgres:16-alpine
    container_name: oms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-oms}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - oms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-oms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - oms-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: oms-kafka
    restart: unless-stopped
    ports:
      # Only the host-facing (EXTERNAL) listener needs to be published. The
      # INTERNAL listener (9092) is reached by other containers over the
      # compose network by service name and never needs a host port.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two data listeners instead of one:
      #  - INTERNAL (9092): what other containers (the app) connect to, using
      #    the service name "kafka".
      #  - EXTERNAL (29092): what host tools (e.g. a local Kafka CLI, or the
      #    app when you run it outside Docker) connect to via localhost.
      # Without this split, Kafka advertises "localhost:9092" to every client
      # regardless of where the initial connection came from — which breaks
      # any client running inside another container, since "localhost" there
      # means the container itself, not the kafka container.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # Runs inside the kafka container, so "localhost:9092" here hits the
      # INTERNAL listener — this is unaffected by the listener split above.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - oms-network

  redis:
    image: redis:7-alpine
    container_name: oms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Password + persistence for anything beyond local dev — set REDIS_PASSWORD in
    # your environment (or an .env file next to this compose file) before deploying.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - oms-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oms-network

  app:
    image: oms:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Both default so a bare `docker compose up --build` still works with
        # no env vars set (matches the Dockerfile ARG defaults). A real build
        # sets these — see the README snippet for the one-liner that does it
        # from the actual git commit.
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-local}
    container_name: oms-app
    restart: unless-stopped
    # Must stay comfortably above spring.lifecycle.timeout-per-shutdown-phase /
    # task.scheduling.shutdown.await-termination-period (both 30s — see
    # application.properties) — Docker sends SIGKILL once this elapses after
    # SIGTERM, regardless of whether the app's own graceful shutdown has
    # finished. Too short here silently defeats that config entirely.
    stop_grace_period: 45s
    ports:
      - "8080:8080"
      # management.server.port in application.properties — actuator
      # (health, info, and now prometheus) lives here, not on 8080. Published
      # to the host so a local Prometheus (or just `curl`/a browser) can
      # reach http://localhost:8081/actuator/prometheus without exec-ing
      # into the container; not something a real deployment would do (see
      # k8s/, where this port is deliberately never routed through the
      # Ingress) — this is a local-dev convenience only.
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oms}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Talks to Kafka's INTERNAL listener (see kafka service above) — do not
      # point this at localhost:9092 or 29092 from inside the app container.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      # See application.properties' "Process role" note. web-only: no Kafka
      # consumers, no outbox poller — pure API server, safe to scale on
      # request load alone. Its own OutboxService.enqueue calls still write
      # PENDING rows; app-worker below is what flushes them.
      APP_PROCESS_ROLE: web
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Port 8081, not 8080 — see the management.server.port comment above.
      test: ["CMD", "curl", "--fail", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - oms-network

  # Same image, same code as `app` — only APP_PROCESS_ROLE differs. Runs the
  # 3 order-events Kafka consumers (inventory reservation, order-saga status
  # transitions, shipment auto-creation) and the outbox poller, nothing else.
  # This is what makes independently scaling worker replicas
  # (`docker compose up -d --scale app-worker=3`) an actual scaling decision
  # instead of scaling one monolithic process that also handles HTTP traffic.
  # See docs/process-roles.md for the full walkthrough, including why `app`
  # itself can't be scaled the same way in this particular compose file
  # (static container_name + host port 8080 on that service) without further
  # changes.
  #
  # No container_name here (unlike `app`) — a fixed name is exactly what
  # `--scale` can't work with, since Docker won't let two containers share
  # one name.
  #
  # Left with Tomcat still running (no spring.main.web-application-type=none)
  # so the same curl-based actuator healthcheck as `app` still works
  # unmodified — the pure resource-saving version of this is a further
  # opt-in step: set SPRING_MAIN_WEB_APPLICATION_TYPE=none here and swap the
  # healthcheck below for something that doesn't need an HTTP listener
  # (e.g. a process check), since /actuator/health won't be servable once
  # the web server never starts.
  app-worker:
    image: oms:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oms}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      APP_PROCESS_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Port 8081, not 8080 — see the management.server.port comment on
      # `app`'s ports: block above; same reasoning applies here.
      test: ["CMD", "curl", "--fail", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - oms-network

  # Scrapes app + app-worker's /actuator/prometheus (see
  # monitoring/prometheus/prometheus.yml) — the local-dev, plain-Prometheus
  # equivalent of k8s/09-podmonitor.yaml. Not on `depends_on` for `app`/
  # `app-worker`: scraping is pull-based and fine with targets not being up
  # yet, so there's no startup-ordering requirement in either direction.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: oms-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - oms-prometheus-data:/prometheus
    networks:
      - oms-network

  # Datasource + the OMS Overview dashboard are auto-provisioned from
  # monitoring/grafana/provisioning/ on startup — nothing to click through
  # manually. Default login is admin / ${GRAFANA_ADMIN_PASSWORD:-admin}; set
  # a real value in .env before exposing this beyond localhost.
  grafana:
    image: grafana/grafana:11.3.1
    container_name: oms-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # First-run-only defaults are fine for local dev; this just silences
      # the "change your password" prompt nagging on every login.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - oms-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - oms-network

networks:
  oms-network:
    driver: bridge

volumes:
  oms-redis-data:
  oms-postgres-data:
  oms-prometheus-data:
  oms-grafana-data: