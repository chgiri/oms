services:
  postgres:
    image: postgres:16-alpine
    container_name: oms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-oms}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - oms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-oms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - oms-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: oms-kafka
    restart: unless-stopped
    ports:
      # Only the host-facing (EXTERNAL) listener needs to be published. The
      # INTERNAL listener (9092) is reached by other containers over the
      # compose network by service name and never needs a host port.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two data listeners instead of one:
      #  - INTERNAL (9092): what other containers (the app) connect to, using
      #    the service name "kafka".
      #  - EXTERNAL (29092): what host tools (e.g. a local Kafka CLI, or the
      #    app when you run it outside Docker) connect to via localhost.
      # Without this split, Kafka advertises "localhost:9092" to every client
      # regardless of where the initial connection came from — which breaks
      # any client running inside another container, since "localhost" there
      # means the container itself, not the kafka container.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # Runs inside the kafka container, so "localhost:9092" here hits the
      # INTERNAL listener — this is unaffected by the listener split above.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - oms-network

  redis:
    image: redis:7-alpine
    container_name: oms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Password + persistence for anything beyond local dev — set REDIS_PASSWORD in
    # your environment (or an .env file next to this compose file) before deploying.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - oms-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oms-network

  # Vault in built-in dev mode: in-memory storage, auto-unsealed, single root
  # token — fine for local parity testing, never use dev mode for uat/prod
  # (see vault/README.md, which covers the real KV + Kubernetes-auth setup
  # those use instead). Root token defaults to a checked-in throwaway value;
  # override VAULT_DEV_ROOT_TOKEN in .env if you want a different one locally.
  vault:
    image: hashicorp/vault:1.19
    container_name: oms-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-oms-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - oms-network

  # One-shot: writes DB_PASSWORD/REDIS_PASSWORD/JWT_PRIVATE_KEY/JWT_PUBLIC_KEY/
  # DEFAULT_ADMIN_PASSWORD into secret/oms/dev (see vault/dev/seed.sh) from the
  # same .env values the rest of this compose file already uses, then exits.
  # app/app-worker's own healthcheck-gated startup means they won't come up
  # meaningfully before this has run, but `service_completed_successfully`
  # below makes that an explicit dependency rather than a race.
  vault-init:
    image: hashicorp/vault:1.19
    container_name: oms-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-oms-dev-root-token}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
    entrypoint: ["/bin/sh", "/vault-init/seed.sh"]
    volumes:
      - ./vault/dev/seed.sh:/vault-init/seed.sh:ro
    networks:
      - oms-network

  app:
    image: oms:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Both default so a bare `docker compose up --build` still works with
        # no env vars set (matches the Dockerfile ARG defaults). A real build
        # sets these — see the README snippet for the one-liner that does it
        # from the actual git commit.
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-local}
    container_name: oms-app
    restart: unless-stopped
    # Must stay comfortably above spring.lifecycle.timeout-per-shutdown-phase /
    # task.scheduling.shutdown.await-termination-period (both 30s — see
    # application.properties) — Docker sends SIGKILL once this elapses after
    # SIGTERM, regardless of whether the app's own graceful shutdown has
    # finished. Too short here silently defeats that config entirely.
    stop_grace_period: 45s
    ports:
      - "8080:8080"
      # management.server.port in application.properties — actuator
      # (health, info, and now prometheus) lives here, not on 8080. Published
      # to the host so a local Prometheus (or just `curl`/a browser) can
      # reach http://localhost:8081/actuator/prometheus without exec-ing
      # into the container; not something a real deployment would do (see
      # k8s/, where this port is deliberately never routed through the
      # Ingress) — this is a local-dev convenience only.
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oms}
      DB_USERNAME: ${DB_USERNAME}
      # Talks to Kafka's INTERNAL listener (see kafka service above) — do not
      # point this at localhost:9092 or 29092 from inside the app container.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Talks to Tempo's OTLP/HTTP receiver by in-network service name — see
      # management.otlp.tracing.endpoint in application.properties and the
      # tempo service above. Same reasoning as KAFKA_BOOTSTRAP_SERVERS: don't
      # point this at localhost from inside the app container.
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      # DB_PASSWORD, REDIS_PASSWORD, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY and
      # DEFAULT_ADMIN_PASSWORD are no longer passed here directly — Vault
      # supplies all five (see vault/dev/seed.sh and
      # application-dev.properties). VAULT_TOKEN below is this dev server's
      # own throwaway root token, not a real secret.
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-oms-dev-root-token}
      # See application.properties' "Process role" note. web-only: no Kafka
      # consumers, no outbox poller — pure API server, safe to scale on
      # request load alone. Its own OutboxService.enqueue calls still write
      # PENDING rows; app-worker below is what flushes them.
      APP_PROCESS_ROLE: web
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      # Port 8081, not 8080 — see the management.server.port comment above.
      test: ["CMD", "curl", "--fail", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - oms-network

  # Same image, same code as `app` — only APP_PROCESS_ROLE differs. Runs the
  # 3 order-events Kafka consumers (inventory reservation, order-saga status
  # transitions, shipment auto-creation) and the outbox poller, nothing else.
  # This is what makes independently scaling worker replicas
  # (`docker compose up -d --scale app-worker=3`) an actual scaling decision
  # instead of scaling one monolithic process that also handles HTTP traffic.
  # See docs/process-roles.md for the full walkthrough, including why `app`
  # itself can't be scaled the same way in this particular compose file
  # (static container_name + host port 8080 on that service) without further
  # changes.
  #
  # No container_name here (unlike `app`) — a fixed name is exactly what
  # `--scale` can't work with, since Docker won't let two containers share
  # one name.
  #
  # Left with Tomcat still running (no spring.main.web-application-type=none)
  # so the same curl-based actuator healthcheck as `app` still works
  # unmodified — the pure resource-saving version of this is a further
  # opt-in step: set SPRING_MAIN_WEB_APPLICATION_TYPE=none here and swap the
  # healthcheck below for something that doesn't need an HTTP listener
  # (e.g. a process check), since /actuator/health won't be servable once
  # the web server never starts.
  app-worker:
    image: oms:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oms}
      DB_USERNAME: ${DB_USERNAME}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Same reasoning as `app` above — see its comment.
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      # Same Vault handoff as `app` above — see that service's comment.
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-oms-dev-root-token}
      APP_PROCESS_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      # Port 8081, not 8080 — see the management.server.port comment on
      # `app`'s ports: block above; same reasoning applies here.
      test: ["CMD", "curl", "--fail", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - oms-network

  # Scrapes app + app-worker's /actuator/prometheus (see
  # monitoring/prometheus/prometheus.yml) — the local-dev, plain-Prometheus
  # equivalent of k8s/09-podmonitor.yaml. Not on `depends_on` for `app`/
  # `app-worker`: scraping is pull-based and fine with targets not being up
  # yet, so there's no startup-ordering requirement in either direction.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: oms-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - oms-prometheus-data:/prometheus
    # Docker Desktop (Mac/Windows) resolves host.docker.internal for free;
    # this line is what makes it also resolve on Linux, where it otherwise
    # doesn't exist. Needed so Prometheus (itself in a container) can reach
    # an app you're running directly from IntelliJ on the host, not just
    # the containerized `app`/`app-worker` — see the oms-host-intellij job
    # in monitoring/prometheus/prometheus.yml.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - oms-network

  # Filesystem-backed, single-binary — see monitoring/loki/loki-config.yaml
  # for why this is local-dev-only, not a production storage backend.
  loki:
    image: grafana/loki:2.9.9
    container_name: oms-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - oms-loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - oms-network

  # Filesystem-backed, single-binary — same local-dev-only reasoning as
  # `loki` above (see monitoring/tempo/tempo-config.yaml). Receives spans
  # over OTLP/HTTP from app/app-worker (see OTLP_TRACING_ENDPOINT below and
  # management.otlp.tracing.endpoint in application.properties) and is
  # queried by Grafana (see the Tempo datasource in
  # monitoring/grafana/provisioning/datasources/datasource.yml). Not on
  # `depends_on` for app/app-worker: span export is push-based over OTLP and
  # tolerates Tempo not being up yet the same way Kafka producer retries do —
  # spans just get dropped/retried, not a startup-ordering requirement.
  tempo:
    image: grafana/tempo:2.6.1
    container_name: oms-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"   # Tempo's own HTTP API — Grafana's datasource URL below
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver — what app/app-worker actually use
    volumes:
      - ./monitoring/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - oms-tempo-data:/var/tempo
    command: -config.file=/etc/tempo.yaml
    networks:
      - oms-network

  # Ships every container's stdout/stderr to Loki — see
  # monitoring/promtail/promtail-config.yaml. Needs the Docker socket
  # (read-only) to discover containers, and the host's docker log directory
  # to actually read them; both are standard for Promtail's docker_sd
  # pattern and work the same on Docker Desktop (Mac/Windows) as on Linux —
  # Docker Desktop resolves this bind mount against its own VM, not your
  # host filesystem, so there's nothing extra to configure there either.
  promtail:
    image: grafana/promtail:2.9.9
    container_name: oms-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - oms-network

  # Datasource + the OMS Overview dashboard are auto-provisioned from
  # monitoring/grafana/provisioning/ on startup — nothing to click through
  # manually. Default login is admin / ${GRAFANA_ADMIN_PASSWORD:-admin}; set
  # a real value in .env before exposing this beyond localhost.
  grafana:
    image: grafana/grafana:11.3.1
    container_name: oms-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # First-run-only defaults are fine for local dev; this just silences
      # the "change your password" prompt nagging on every login.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - oms-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - oms-network

  # GraphQL aggregation layer sitting behind `gateway`, in front of `app` —
  # see oms-bff/README.md. `gateway` depends on this being healthy before it
  # starts, since its own route to /graphql needs somewhere to send traffic.
  #
  # Same image/build pattern as `gateway` above — a sibling checkout at
  # ../oms-bff, `image:` + `build:` together so local dev builds from source
  # (`docker compose up --build`) while CI/CD just sets BFF_VERSION and pulls
  # the already-built image.
  bff:
    image: oms-bff:${BFF_VERSION:-local}
    build:
      context: ../oms-bff
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${BFF_VERSION:-local}
    container_name: oms-bff
    restart: unless-stopped
    ports:
      - "8095:8095"
      - "8096:8096"
    environment:
      OMS_MONOLITH_URI: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8096/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - oms-network

  # Spring Cloud Gateway sitting in front of `app` — JWT validation at the
  # edge, Redis-backed login rate limiting, CORS. See oms-gateway/README.md.
  #
  # Included by default (no `profiles:` key) so `docker compose up` starts
  # the whole stack in one shot, per-repo dev workflow, and CI/CD alike.
  # If you're actively iterating on the gateway itself in IntelliJ, just
  # exclude it explicitly for that session instead:
  #   docker compose up $(docker compose config --services | grep -v ^gateway$)
  # against REDIS_HOST=localhost / OMS_MONOLITH_URI=http://localhost:8080 /
  # VAULT_ADDR=http://localhost:8200 (all published to the host already).
  #
  # `image:` + `build:` together (same pattern as `app` above) is what makes
  # one file work for both local dev and CI/CD:
  #  - Local dev: `docker compose up --build` builds from ../oms-gateway and
  #    tags the result oms-gateway:local — zero setup, no registry needed.
  #  - CI/CD: the oms-gateway repo's own pipeline builds and pushes
  #    oms-gateway:<git-sha> to a registry; the deploy step here just sets
  #    GATEWAY_VERSION=<that tag> and runs `docker compose up` WITHOUT
  #    --build, so it pulls the already-built, already-tested image instead
  #    of rebuilding from source — Factor V (build/release/run as separate
  #    stages), not a live build baked into the run step.
  gateway:
    image: oms-gateway:${GATEWAY_VERSION:-local}
    build:
      # Sibling checkout, not a nested copy — oms-gateway stays its own repo
      # with its own git history (Factor I: one codebase per app). Expects
      # this layout on disk:
      #   dev/oms-main/       <- this docker-compose.yml
      #   dev/oms-gateway/    <- cloned separately, next to it
      context: ../oms-gateway
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${GATEWAY_VERSION:-local}
    container_name: oms-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      OMS_MONOLITH_URI: http://app:8080
      OMS_JWKS_URI: http://app:8080/.well-known/jwks.json
      OMS_BFF_URI: http://bff:8095
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # REDIS_PASSWORD not passed directly — Vault supplies it from
      # secret/oms/dev, the same path `app`/`app-worker` already read (see
      # spring.cloud.vault.kv.default-context=oms in the gateway's own
      # application.properties). VAULT_TOKEN below is the same dev-mode
      # root token they already use.
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-oms-dev-root-token}
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - oms-network

  # --- Phase 4 (microservices-prep plan): Product extraction ---------------
  # Folded in from product-service's own docker-compose.snippet.yml — see
  # that file's header comment for the original instructions this follows.
  # Own Postgres (product-db) per the Phase 4 plan's data-cutover step, but
  # shares oms-main's existing kafka/redis containers, same as any other
  # service reaching the same broker/cache cluster would in a real
  # deployment.
  product-db:
    image: postgres:16-alpine
    container_name: oms-product-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_service
      POSTGRES_USER: ${PRODUCT_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:-postgres}
    ports:
      - "5433:5432" # 5433, not 5432 — oms-main's own postgres is already on 5432 on the host
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oms-network

  product-service:
    image: product-service:${PRODUCT_SERVICE_VERSION:-local}
    build:
      # Sibling checkout, not a nested copy — same Factor-I reasoning as
      # `gateway`/`bff` above. Expects the same sibling-directory layout:
      #   dev/oms-main/          <- this docker-compose.yml
      #   dev/product-service/   <- cloned separately, next to it
      context: ../product-service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${PRODUCT_SERVICE_VERSION:-local}
    container_name: oms-product-service
    restart: unless-stopped
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      # product-service verifies JWTs against app's JWKS endpoint (see its
      # own security.SecurityConfig) — needs app up, not just started, same
      # as `gateway` above depending on it for the identical reason.
      app:
        condition: service_healthy
    environment:
      DB_HOST: product-db
      DB_PORT: 5432
      DB_NAME: product_service
      DB_USERNAME: ${PRODUCT_DB_USERNAME:-postgres}
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-postgres}
      # INTERNAL listener (9092), not EXTERNAL (29092) — this runs inside
      # the compose network, same as `app`/`app-worker` above. The original
      # snippet had this pointed at 29092 (the host-only listener) before
      # being folded in here — see the kafka service's own comment on the
      # INTERNAL/EXTERNAL split for why that would have been wrong.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: "1" # distinct logical DB from oms-main's own cache — avoids key collisions on the shared instance
      AUTH_SERVICE_JWKS_URI: http://app:8080/.well-known/jwks.json
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8082:8080"
      # 8093, not 8091 — 8091 is already oms-gateway's host port above; the
      # original snippet had 8091 here too, which would have collided.
      - "8093:8081" # management/actuator port
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    networks:
      - oms-network

  # --- Phase 4 (microservices-prep plan): Customer extraction --------------
  # Folded in from customer-service's own docker-compose.snippet.yml — same
  # pattern as product-service above. No redis wiring — customer-service has
  # no caching (see that repo's pom.xml for why).
  customer-db:
    image: postgres:16-alpine
    container_name: oms-customer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_service
      POSTGRES_USER: ${CUSTOMER_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oms-network

  customer-service:
    image: customer-service:${CUSTOMER_SERVICE_VERSION:-local}
    build:
      context: ../customer-service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${CUSTOMER_SERVICE_VERSION:-local}
    container_name: oms-customer-service
    restart: unless-stopped
    depends_on:
      customer-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      DB_HOST: customer-db
      DB_PORT: 5432
      DB_NAME: customer_service
      DB_USERNAME: ${CUSTOMER_DB_USERNAME:-postgres}
      DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-postgres}
      # Same INTERNAL-listener fix as product-service above.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_SERVICE_JWKS_URI: http://app:8080/.well-known/jwks.json
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8083:8080"
      - "8092:8081" # management/actuator port — free, no collision
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    networks:
      - oms-network

networks:
  oms-network:
    driver: bridge

volumes:
  oms-redis-data:
  oms-postgres-data:
  oms-prometheus-data:
  oms-grafana-data:
  oms-loki-data:
  oms-tempo-data:
  product-db-data:
  customer-db-data: